services:

  data-collector-filesystem:
    image: $DC_IMAGE
    ports:
      - 9990:9990
      - 9992:9992
    environment:
      - JAVA_OPTS=-Dlog4j2.configurationFile=/conf/log4j2.xml
    volumes:
    - $WORKDIR/profile/$PROFILE/conf:/conf
    - $WORKDIR/profile/$PROFILE/certs:/certs
    - $WORKDIR/target:/target
