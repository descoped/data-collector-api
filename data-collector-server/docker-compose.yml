services:

  postgresdb:
    image: postgres:18.7-alpine
    ports:
    - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
    - rdcpostgres-test:/var/lib/postgresql
    - ./init-db-and-user.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer:6.3.0
    ports:
    - 8080:8080

volumes:
  rdcpostgres-test:

