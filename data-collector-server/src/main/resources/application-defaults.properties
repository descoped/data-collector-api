http.host=0.0.0.0
http.port=9990

http.cors.allow.origin=.*
http.cors.allow.header=Content-Type,Authorization
http.cors.allow.methods=POST,GET,PUT,DELETE,HEAD
http.cors.allow.credentials=false
http.cors.allow.max-age=900

content.stream.connector=rawdata

rawdata.client.provider=memory
#rawdata.client.provider=postgres
#rawdata.client.provider=pulsar
#rawdata.client.provider=kafka

file.system.provider.directory=/rawdata

postgres.driver.host=localhost
postgres.driver.port=5432
postgres.driver.user=rdc
postgres.driver.password=rdc
postgres.driver.database=rdc

rawdata.postgres.consumer.prefetch-size=100
rawdata.postgres.consumer.prefetch-poll-interval-when-empty=1000

#data.collector.rawdata.dump.enabled=true
#data.collector.rawdata.dump.location=./storage
#data.collector.rawdata.dump.topic=TOPIC

# Keys an operator sets, declared empty: dynamic-configuration 3 lets DC_ environment variables and system properties
# override only declared keys, and the server reads an empty value as unset. A DC_RAWDATA_ENCRYPTION_* or
# DC_DATA_COLLECTOR_SSLBUNDLE_* variable without a key here stops the server.

# Encryption of content (see README)
rawdata.encryption.provider=
rawdata.encryption.key=
rawdata.encryption.salt=
rawdata.encryption.gcp.projectId=
rawdata.encryption.gcp.serviceAccountKeyPath=
recovery.rawdata.encryption.credentials.ignore=

# Business certificates
data.collector.certs.directory=
data.collector.sslBundle.provider=
data.collector.sslBundle.type=
data.collector.sslBundle.name=
data.collector.sslBundle.gcp.projectId=
data.collector.sslBundle.gcp.serviceAccountKeyPath=
data.collector.sslBundle.publicCertificate=
data.collector.sslBundle.privateCertificate=
data.collector.sslBundle.archiveCertificate=
data.collector.sslBundle.passphrase=

# Engine
data.collector.worker.threads=
data.collector.print-execution-plan=
data.collector.parallel.queueBuffer.threshold=
data.collector.http.version=
data.collector.http.followRedirects=
data.collector.http.client.timeout.seconds=
data.collector.http.request.timeout.seconds=
data.collector.http.request.retryCount=
data.collector.http.request.napOnRetryInMillis=
data.collector.integrityCheck.database.location=
data.collector.integrityCheck.dbSizeInMb=
data.collector.integrityCheck.consumer.timeoutInSeconds=
prometheus.defaultExports.disabled=

# rawdata-client providers: filesystem, gcs (avro engine) and postgres
local-temp-folder=
filesystem.storage-folder=
gcs.bucket-name=
gcs.prefix=
gcs.endpoint=
gcs.credential-provider=
gcs.service-account.key-file=
gcs.listing.min-interval-seconds=
listing.min-interval-seconds=
avro-file.max.seconds=
avro-file.max.bytes=
avro-file.sync.interval=
avro-file.max.pending-uploads=
avro-file.close-timeout-seconds=
avro-file.upload.max-concurrency=
postgres.driver.max-pool-size=
